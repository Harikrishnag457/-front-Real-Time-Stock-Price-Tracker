<!-- search.component.html -->
<div class="flex justify-between items-center mb-2">
  <!-- Search Input -->
  <input type="text" placeholder="Search for stock symbol..." [formControl]="searchControl"
    class="w-[350px] p-2 rounded-[8px] text-[16px] uppercase bg-white border border-[#3a3a3a] shadow-md focus:outline-none placeholder:text-[#3a3a3a] placeholder:capitalize"  />

  <!-- User Info -->
  <div class="flex items-center space-x-3">
    <img src="https://tse4.mm.bing.net/th/id/OIP.xSDeAf_dCpSln8f60zHcYQHaHa?w=204&h=205&c=7&r=0&o=5&dpr=1.5&pid=1.7" alt="User" class="w-10 h-10 rounded-full">
    <span class="font-semibold">Stanly Tochukwu</span>
  </div>
</div>

<!-- Suggestions dropdown -->
<ul class="suggestions-list bg-white absolute shadow-lg rounded-lg border border-gray-200 max-h-60 overflow-y-auto w-[350px]"
    *ngIf="suggestions && suggestions.length">
  <li class="suggestion-item px-4 py-2 cursor-pointer hover:bg-gray-100 transition-all duration-200"
      *ngFor="let suggestion of suggestions"
      (click)="selectSuggestion(suggestion)">
    <span class="font-medium text-gray-800">{{ suggestion.symbol }}</span>
  </li>
</ul>
